project:
  type: book
  output-dir: _book
  preview:
    port: 8989

extensions:
  - reveal-vspace
  - _extensions/shield_badge

filters:
  - pseudocode

resources:
  - custom_package/
  - include/
  - js/
  - badges/

book:
  title: "Python Package Guideline"
  open-graph: true
  page-navigation: true
  google-analytics:
    tracking-id: "G-EX9H7GRLTH"
  favicon: img/favicon.ico
  site-url: https://ryonakagami.github.io/python-package-guidline
  repo-url: https://github.com/RyoNakagami/python-package-guidline
  issue-url: https://github.com/RyoNakagami/python-package-guidline/issues
  sharing: twitter
  sidebar:
      tools:
       - text: Blog Series
         icon: book
         menu:
         - text: Ryo's Tech Blog
           href: https://ryonakagami.github.io/regmonkey-datascience-blog/
           aria-label: blog-general
         - text: stats for regmonkey
           href: https://ryonakagami.github.io/statistics-for-regression-monkey/
           aria-label: blog-regmonkey
         - text: presentations blog
           href: https://ryonakagami.github.io/regmonkey-presentation/
           aria-label: blog-regmonkey
         - text: OhGoshGit!?!
           href: https://ohgoshgit.github.io/
           aria-label: blog-ogg
       - icon: rss
         href: index.xml
  repo-actions: [edit, issue]
  page-footer:
    border: false
    center:
      - text: © Copyright RyoNak
      - text: "License"
        href: LICENSE

  chapters:
    - index.qmd
    # >>> AUTO-POSTS:START (generated by scripts/gen_chapters.py — do not edit by hand) <<<
    # >>> AUTO-POSTS:END <<<
  appendices:
    # >>> AUTO-APPENDIX:START (generated by scripts/gen_chapters.py — do not edit by hand) <<<
    - posts/999_appendix/glossary.qmd
    # >>> AUTO-APPENDIX:END <<<

format:
  html:
    include-in-header:
      - include/setup_googletagmanager.html
      - include/custom_webfont.html
      - include/mathjax.html
      - include/custom_function.html
    include-in-body:
      - include/setup_googletagmanager_body.html
    include-after-body:
      - include/custom_section.html
    lang: ja
    number-depth: 1
    self-contained: false
    jupyter: python3
    highlight-style: github
    theme:
      light:
        - standalone
        - include/custom.scss
        - include/light.scss
      dark:
        - darkly
        - include/custom.scss
        - include/dark.scss
    code-copy: true
    code-fold: true
    code-overflow: wrap
    date-format: "iso"
    css: styles.css
    mainfont: "Noto Sans JP"
    monofont: monospace
    toc: true
    highlight: arrow
    grid:
      sidebar-width: 250px
      body-width: 1000px
      margin-width: 250px
    mermaid:
      theme: neutral
    pseudocode:
      caption-prefix: "Algorithm"      # Prefix for captions (default: "Algorithm")
      reference-prefix: "Algorithm"   # Prefix for references (default: "Algorithm")
      caption-number: true

execute:
  freeze: auto
  keep-ipynb: false

tbl-cap-location: top
