phases: [init, packaging, develop, test, release, ci, docs]
severities: [required, recommended, forbidden]
rule_types: [structural, naming, dependency, process, config, style]
relation_types: [prerequisite, exception, contrasts, extends]
maturities: [stable, draft, experimental]
categories: [PKG, TEST, CI, GIT, DEV, UV]
constraints:
  statement_min_len: 10
  statement_max_len: 200
  tldr_max_len: 120
  rule_id_pattern: '^[A-Z]+-[A-Z]+-\d{3}$'
  slug_pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
